<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>distant streams</title>

    <!-- update the version number as needed -->
    <script defer src="/__/firebase/7.13.1/firebase-app.js"></script>
    <!-- include only the Firebase features as you need -->
    <script defer src="/__/firebase/7.13.1/firebase-firestore.js"></script>
    <!-- initialize the SDK after all desired features are loaded -->
    <script defer src="/__/firebase/init.js"></script>

    <link rel="stylesheet" type="text/css" href="main.css">
</head>
<body>

<div id="videos" >
    <video id="localVideo" muted autoplay playsinline disablepictureinpicture style="display:none"></video>
    <video id="remoteVideo" autoplay playsinline disablepictureinpicture style="display:none" class="blend"></video>
</div>
<div id="info">
    <h1>distant streams~</h1>
</div>

<div id="infoContainer">
    <div id="buttons">
        <p>quadraphonic p2p audio streaming over WebRTC.</p>
        <p><a href="https://www.firefox.com/en-US/landing/get/?utm_medium=paidsearch&utm_source=google-rsa&utm_campaign=fx-performance&utm_content=Brand&gclsrc=aw.ds&gad_source=1&gad_campaignid=21953014515&gclid=EAIaIQobChMIxLzDmob6lwMVj-CfCR0lDBccEAAYASAAEgIrqfD_BwE">firefox</a> only (for now)</p>
        <button id="inDeviceBtn">
            <span>Search for Sound and Video Devices</span>
        </button>
        <p>input device</p>
        <select id="audioInputSelect" value="select audio input">
            <option disabled selected value="">scan for devices</option>
        </select>
        <p>ouput device</p>
        <select id="audioOutputSelect" value="select audio output">
            <option selected value="">default output</option>
        </select>
        <label for="localGainSlider">Local Gain: </label>
        <input type="range" id="localGainSlider" min="0" max="1" step="0.01" value="0.75">
        <label for="peerGainSlider">Peer Gain: </label>
        <input type="range" id="peerGainSlider" min="0" max="1" step="0.01" value="0.75">
        <p>video device</p>
        <select id="videoInputSelect" value="select video input">
            <option disabled selected value="">scan for devices</option>
        </select>
        <p>video overlay</p>
        <select id="blendModeSelect">
            <option value="normal">normal</option>
            <option value="multiply">multiply</option>
            <option value="screen">screen</option>
            <option value="overlay" selected>overlay</option>
            <option value="darken">darken</option>
            <option value="lighten">lighten</option>
            <option value="color-dodge">color-dodge</option>
            <option value="color-burn">color-burn</option>
            <option value="hard-light">hard-light</option>
            <option value="soft-light">soft-light</option>
            <option value="difference">difference</option>
            <option value="exclusion">exclusion</option>
            <option value="hue">hue</option>
            <option value="saturation">saturation</option>
            <option value="color">color</option>
            <option value="luminosity">luminosity</option>
        </select>
        <select id="topVideoSelect">
            <option value="remoteVideo" selected>remote video on top</option>
            <option value="localVideo">local video on top</option>
        </select>

        <button id="cameraBtn">
            <span>Open camera & microphone</span>
        </button>
        <button disabled id="createBtn">
            
            <span>Create room</span>
            
        </button>
        <button disabled id="joinBtn">
            <span>Join room</span>
        </button>
        <button disabled id="hangupBtn">
            <span>Hangup</span>
        </button>
        <div id="currentRoom">
            <div id="roomCodeRow" hidden>
                <code id="roomCode" aria-label="Room code"></code>
                <button id="copyRoomCodeBtn" type="button">copy</button>
            </div>
            <div id="roomStatus"></div>
        </div>
        <dialog id="room-dialog" aria-labelledby="room-dialog-title">
            <form method="dialog">
                <h3 id="room-dialog-title">Join room</h3>
                <label for="room-id">Room ID</label>
                <input type="text" id="room-id" placeholder="4-letter code" required minlength="4" maxlength="4" autocomplete="off" autocapitalize="none" spellcheck="false">
                <footer>
                    <!-- Join comes first so Enter submits it; row-reverse keeps it on the right -->
                    <button id="confirmJoinBtn" value="yes">Join</button>
                    <button value="no" formnovalidate>Cancel</button>
                </footer>
            </form>
        </dialog>
    </div>
    
</div>



<script src="app.js" type="module"></script>
</body>
</html>
